name: Package and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v-prefixed tag to package and release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve and validate release tag
        id: release_ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref }}
          REQUESTED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$PUSH_REF" == refs/tags/* ]] || exit 1
            release_tag="${PUSH_REF#refs/tags/}"
          else
            release_tag="$REQUESTED_TAG"
          fi

          # A restricted tag grammar avoids ambiguous refs and unsafe shell input.
          [[ "$release_tag" =~ ^v[0-9][0-9A-Za-z._-]*$ ]] || {
            echo "Release tags must start with v followed by a digit." >&2
            exit 1
          }
          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

      - name: Check out release tag and submodules
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.release_ref.outputs.tag }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Confirm the checked out revision matches the release tag
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse --verify HEAD)" == "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")" ]]

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Build release archive
        run: python3 scripts/package_release.py --output dist/grade-informed-etd-decision-support.zip

      - name: Create checksum
        working-directory: dist
        run: sha256sum grade-informed-etd-decision-support.zip > grade-informed-etd-decision-support.zip.sha256

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
          ARCHIVE: dist/grade-informed-etd-decision-support.zip
          CHECKSUM: dist/grade-informed-etd-decision-support.zip.sha256
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE" "$CHECKSUM" --clobber
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE" "$CHECKSUM" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
