pack_id: health
version: 2.0.0
applicability_questions:
- Does the decision directly affect health outcomes, clinical care, public health, or health systems?
- Is the question a comparison of health interventions with patient-important outcomes?
candidates:
- candidate_id: health.outcome.patient_important_benefit
  candidate_type: outcome
  label: Patient-important benefit
  rule: Consider mortality, morbidity, symptoms, function, quality of life, and service use.
- candidate_id: health.harm.adverse_events
  candidate_type: harm
  label: Adverse events and burden
  rule: Consider adverse events, delayed care, diagnostic error, treatment burden, privacy loss, and opportunity
    cost.
- candidate_id: health.equity.progress_plus
  candidate_type: equity
  label: PROGRESS-Plus and local equity groups
  rule: Identify groups with different access, baseline risk, benefit, burden, or harm.
- candidate_id: health.implementation.capacity
  candidate_type: implementation
  label: Clinical and public-health capacity
  rule: Assess workforce, training, supply, referral pathways, data governance, and regulation.
- candidate_id: health.monitoring.patient_outcomes
  candidate_type: monitoring
  label: Patient-important outcomes and adverse events
  rule: Monitor benefits, adverse events, coverage, equity gaps, fidelity, and resource use.
evidence_source_map:
- Systematic reviews
- Randomized and non-randomized studies
- Safety surveillance
- Qualitative evidence
- Health economic evidence
jurisdiction_prompts:
- Clinical standards
- Reimbursement
- Privacy and consent
- Professional regulation
- Public-health authority
exclusion_rules:
- Formal GRADE EtD support in this skill is limited to comparative health-intervention recommendations.
- Do not use formal GRADE for individual diagnosis or treatment decisions without authorized clinicians.
composition_rules:
- Deduplicate candidates by concept while preserving pack provenance.
- Separate health-outcome certainty methods from non-health outcomes.
- Record unresolved cross-domain conflicts rather than silently prioritizing a pack.
