pack_id: academic
version: 1.0.0
status: draft
scope:
  included_use_cases:
  - research_priority_setting
  - research_resource_allocation
  - research_plan_quality_transparency_feasibility
  - research_output_or_method_sharing
  excluded_use_cases:
  - education_assessment
  - hiring_or_promotion
  - manuscript_acceptance
  - misconduct_investigation
source_basis:
- source_id: who.research_priority_pipe
  title: A systematic approach for undertaking a research priority-setting exercise
  authority: World Health Organization
  normative_status: external_guidance
  source_ref: https://tdr.who.int/publications/i/item/a-systematic-approach-for-undertaking-a-research-priority-setting-exercise
  adaptation_note: Supports context-sensitive, ethical, equitable, transparent planning, implementation, publication, and evaluation of priority setting.
- source_id: unesco.open_science_2021
  title: UNESCO Recommendation on Open Science
  authority: UNESCO
  normative_status: external_standard
  source_ref: https://www.unesco.org/en/legal-affairs/recommendation-open-science
  adaptation_note: Supports transparency, scrutiny, reproducibility, equality of opportunity, responsibility, accountability, participation, and inclusion.
- source_id: coara.research_assessment_agreement
  title: Agreement on Reforming Research Assessment
  authority: Coalition for Advancing Research Assessment
  normative_status: external_guidance
  source_ref: https://coara.eu/news/the-agreement-on-reforming-research-assessment-is-now-final/
  adaptation_note: Supports qualitative judgment, responsible quantitative indicators, and recognition of diverse research outputs and practices.
- source_id: nih.rigor_reproducibility
  title: Enhancing Reproducibility through Rigor and Transparency
  authority: US National Institutes of Health
  normative_status: external_guidance
  source_ref: https://grants.nih.gov/policy-and-compliance/policy-topics/reproducibility
  adaptation_note: Supports rigorous design, transparency, and reproducibility; applicability outside biomedical research must be justified.
- source_id: allea.research_integrity_2023
  title: European Code of Conduct for Research Integrity, 2023 Revised Edition
  authority: All European Academies
  normative_status: external_standard
  source_ref: https://allea.org/code-of-conduct/
  adaptation_note: Supports research-integrity principles and good research practices across disciplines; jurisdiction-specific obligations still require local review.
- source_id: hhs.belmont_report
  title: The Belmont Report
  authority: US Department of Health and Human Services, Office for Human Research Protections
  normative_status: external_standard
  source_ref: https://www.hhs.gov/ohrp/regulations-and-policy/belmont-report/index.html
  adaptation_note: Supports respect for persons, beneficence, and justice for human-subject research; it does not govern every research type or jurisdiction.
applicability_questions:
- Is the decision about prioritising research questions, plans, resources, methods, outputs, or sharing practices?
- Is an auditable allocation or assessment needed rather than a hiring, promotion, misconduct, or publication-acceptance judgment?
candidates:
- candidate_id: academic.scientific_or_scholarly_value
  candidate_type: criterion
  label: Scientific or scholarly value
  case_question: How important is the knowledge gap, and what contribution could the work make?
  selection_rule: Select when prioritising a question, plan, portfolio, or resource allocation.
  evidence_types: [research_landscape, stakeholder_priority_input, theory_or_prior_work]
  core_mapping: problem
  source_refs: [who.research_priority_pipe, coara.research_assessment_agreement]
  adaptation_note: Source-derived priority and assessment concepts, expressed as a local EtD mapping.
- candidate_id: academic.methodological_credibility
  candidate_type: criterion
  label: Methodological credibility
  case_question: Are the design, methods, analysis, and interpretation capable of answering the question without avoidable bias?
  selection_rule: Select for plan quality, funding, staffing, or method-choice decisions.
  evidence_types: [protocol, methods_review, pilot_data, prior_validation]
  core_mapping: certainty_of_effects
  source_refs: [nih.rigor_reproducibility]
  adaptation_note: Source-derived rigor and reproducibility concepts; the Canonical certainty slot is a local non-GRADE mapping.
- candidate_id: academic.feasibility_and_capacity
  candidate_type: criterion
  label: Feasibility and capacity
  case_question: Are time, expertise, infrastructure, data, recruitment, and governance capacity adequate?
  selection_rule: Select when execution or resource allocation is material.
  evidence_types: [workplan, staffing_plan, budget, infrastructure_assessment, pilot_data]
  core_mapping: feasibility
  source_refs: [who.research_priority_pipe]
  adaptation_note: Source-derived planning considerations, adapted locally to feasibility and capacity.
- candidate_id: academic.ethics_and_integrity
  candidate_type: criterion
  label: Ethics and integrity
  case_question: Are applicable human-participant protections, research-integrity duties, conflicts, and any jurisdiction-specific animal or environmental obligations identified and governed?
  selection_rule: Select whenever ethical or integrity impacts are plausible; do not infer approval.
  evidence_types: [ethics_review, governance_policy, conflict_disclosure, risk_assessment]
  core_mapping: additional:academic.ethics_and_integrity
  source_refs: [allea.research_integrity_2023, hhs.belmont_report, unesco.open_science_2021]
  adaptation_note: Local synthesis. ALLEA supports integrity, Belmont supports human-subject ethics, and other animal or environmental duties require case-specific authoritative sources.
- candidate_id: academic.transparency_and_reproducibility
  candidate_type: criterion
  label: Transparency and reproducibility
  case_question: Are protocols, methods, data, code, materials, limitations, and outputs as open and reproducible as law, ethics, and context allow?
  selection_rule: Select for plan, method, reporting, or sharing decisions.
  evidence_types: [data_management_plan, protocol_registration, code_or_materials_plan, reporting_plan]
  core_mapping: additional:academic.transparency_and_reproducibility
  source_refs: [unesco.open_science_2021, nih.rigor_reproducibility]
  adaptation_note: Source-derived openness, rigor, and reproducibility concepts combined in a local additional criterion.
- candidate_id: academic.distribution_of_benefits_and_burdens
  candidate_type: criterion
  label: Distribution of benefits and burdens
  case_question: Who receives resources, opportunities, recognition, access, benefits, and burdens?
  selection_rule: Select for priority setting, allocation, participation, and dissemination decisions.
  evidence_types: [distributional_analysis, stakeholder_input, participation_data]
  core_mapping: equity
  source_refs: [who.research_priority_pipe, unesco.open_science_2021]
  adaptation_note: Source-derived equity and participation concepts mapped locally to distributional effects.
- candidate_id: academic.dissemination_and_use
  candidate_type: criterion
  label: Dissemination and use
  case_question: Can intended users access, understand, scrutinise, reuse, or act on the outputs?
  selection_rule: Select when output, knowledge translation, publication, or sharing is material.
  evidence_types: [dissemination_plan, user_input, access_plan, implementation_pathway]
  core_mapping: acceptability
  source_refs: [who.research_priority_pipe, unesco.open_science_2021]
  adaptation_note: Local synthesis of publication, participation, access, and use considerations.
exclusion_rules:
- Do not use this pack for hiring, promotion, manuscript acceptance, or misconduct findings.
- Do not treat pack use as institutional, ethical, funder, or formal GRADE approval.
composition_rules:
- Use this initial pack alone; record cross-domain needs in the gap log rather than composing packs.
- Preserve candidate-level source provenance and distinguish external guidance from local mappings.
