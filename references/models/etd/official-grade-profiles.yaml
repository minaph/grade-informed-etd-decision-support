name: "official-grade-profiles"
description: "公式GRADE EtDの問い・視点・結論形式に応じた参照プロファイルと出典を選ぶ。実行可能な評価手法ではない。"
kind: "registry"
registry_id: grade-etd-reference-profiles
version: 2.0.0
status: reference
last_verified: 2026-07-29
criteria_vocabulary:
  extension:
  - resource_certainty
  - cost_effectiveness
  - test_accuracy
  - certainty_test_accuracy
  - certainty_test_effects
  - certainty_management_effects
  - certainty_test_result_management
  common:
  - problem
  - desirable_effects
  - undesirable_effects
  - certainty_of_effects
  - values
  - balance_of_effects
  - resources
  - equity
  - acceptability
  - feasibility
source_catalog:
- source_id: gradepro.etd_templates
  title: EtD templates
  authority: GRADEpro
  normative_status: official_grade
  url: https://help.gradepro.org/support/solutions/articles/204000076809-etd-templates
  note: Public template comparison; profiles below encode the published defaults,
    not immutable minimum requirements.
- source_id: gradepro.user_guide
  title: GRADEpro GDT User Guide
  authority: GRADEpro
  normative_status: official_grade
  url: https://gdt.gradepro.org/app/help/user_guide/index.html
  note: Defines the intended question, perspective, and conclusion use of each template
    and states that organisations may modify templates.
