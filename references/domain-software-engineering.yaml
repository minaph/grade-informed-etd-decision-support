pack_id: software_engineering
version: 1.0.0
status: draft
scope:
  included_use_cases:
  - architecture_or_major_technology_selection
  - implementation_or_change_strategy
  - secure_development_policy
  - quality_attribute_tradeoff
  excluded_use_cases:
  - coding_style
  - visual_design
  - general_project_management
  - personnel_decision
  - general_vendor_contracting
source_basis:
- source_id: iso.iec.25010.2023
  title: ISO/IEC 25010:2023 product quality model
  authority: ISO and IEC
  normative_status: external_standard
  source_ref: https://www.iso.org/standard/78176.html
  adaptation_note: Public abstract supports use of a nine-characteristic reference model for product quality specification and evaluation; no paywalled detail is reproduced.
- source_id: nist.ssdf.1.1
  title: NIST SP 800-218 Secure Software Development Framework Version 1.1
  authority: US National Institute of Standards and Technology
  normative_status: external_standard
  source_ref: https://csrc.nist.gov/pubs/sp/800/218/final
  adaptation_note: Supports integration of secure-development practices into each SDLC and reduction, mitigation, and prevention of vulnerabilities.
- source_id: sei.atam
  title: Architecture Tradeoff Analysis Method
  authority: Carnegie Mellon University Software Engineering Institute
  normative_status: external_method
  source_ref: https://www.sei.cmu.edu/library/architecture-tradeoff-analysis-method-collection/
  adaptation_note: Supports scenario-based evaluation of architecture risks, sensitivities, and tradeoffs relative to business drivers and quality-attribute goals.
- source_id: nist.cloud_standards_roadmap
  title: NIST Cloud Computing Standards Roadmap
  authority: US National Institute of Standards and Technology
  normative_status: external_guidance
  source_ref: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.500-291r2.pdf
  adaptation_note: Supports interoperability and portability analysis for cloud scenarios and identifies vendor lock-in as a cloud adoption concern.
- source_id: w3c.wcag22
  title: Web Content Accessibility Guidelines 2.2
  authority: World Wide Web Consortium
  normative_status: external_standard
  source_ref: https://www.w3.org/TR/WCAG22/
  adaptation_note: Supports accessibility evaluation for web content only; it is not generalized to all operator or software quality questions.
applicability_questions:
- Is the decision about architecture, a major technology, a change strategy, secure development, or a material quality-attribute tradeoff?
- Could the decision materially affect users, operators, reliability, security, lifecycle cost, or reversibility?
candidates:
- candidate_id: software.fitness_for_purpose
  candidate_type: criterion
  label: Fitness for purpose
  case_question: Does each option satisfy the explicit business drivers, user outcomes, constraints, and acceptance criteria?
  selection_rule: Select for every in-scope decision.
  evidence_types: [requirements, acceptance_criteria, prototype_results, stakeholder_scenarios]
  core_mapping: desirable_effects
  source_refs: [iso.iec.25010.2023, sei.atam]
  adaptation_note: Source-derived product-quality and business-driver concepts expressed through case-specific acceptance scenarios.
- candidate_id: software.architectural_quality_tradeoffs
  candidate_type: criterion
  label: Architectural quality tradeoffs
  case_question: Which quality attributes, sensitivity points, risks, and tradeoffs change under each option?
  selection_rule: Select for architecture or material design choices.
  evidence_types: [quality_attribute_scenarios, architecture_analysis, benchmark, failure_analysis]
  core_mapping: balance_of_effects
  source_refs: [iso.iec.25010.2023, sei.atam]
  adaptation_note: Directly grounded in ATAM tradeoff analysis; ISO supplies only the public quality-model framing.
- candidate_id: software.security_risk
  candidate_type: criterion
  label: Security risk
  case_question: How does the option prevent, identify, remediate, and learn from vulnerabilities across the lifecycle?
  selection_rule: Select when software is produced, acquired, deployed, or materially changed.
  evidence_types: [threat_model, security_testing, vulnerability_history, ssdf_practice_assessment]
  core_mapping: undesirable_effects
  source_refs: [nist.ssdf.1.1]
  adaptation_note: Source-derived secure-development lifecycle questions; a case-specific threat model remains separate.
- candidate_id: software.maintainability_and_change_cost
  candidate_type: criterion
  label: Maintainability and change cost
  case_question: What are the likely effort, coupling, skill, test, migration, and lifecycle costs of future change?
  selection_rule: Select when the system will evolve or maintenance burden is material.
  evidence_types: [change_scenarios, codebase_metrics, staffing_data, migration_estimate]
  core_mapping: resources
  source_refs: [iso.iec.25010.2023, sei.atam]
  adaptation_note: Local synthesis of maintainability scenarios and lifecycle resource implications; estimates require case evidence.
- candidate_id: software.reliability_and_operational_risk
  candidate_type: criterion
  label: Reliability and operational risk
  case_question: How do availability, recoverability, observability, failure modes, and operational complexity differ?
  selection_rule: Select for production systems or operationally consequential changes.
  evidence_types: [slo_data, incident_history, failure_mode_analysis, load_or_resilience_test]
  core_mapping: undesirable_effects
  source_refs: [iso.iec.25010.2023, sei.atam]
  adaptation_note: Local synthesis of reliability quality goals and operational scenarios; no reliability level is inferred from the sources.
- candidate_id: software.performance_and_resource_use
  candidate_type: criterion
  label: Performance and resource use
  case_question: Are latency, throughput, capacity, and compute, storage, network, or energy use fit for the required scenarios?
  selection_rule: Select only when performance or resource efficiency is decision-material.
  evidence_types: [benchmark, load_test, capacity_model, cost_model]
  core_mapping: resources
  source_refs: [iso.iec.25010.2023]
  adaptation_note: Public ISO quality-model framing only; performance and resource judgments require measured case evidence.
- candidate_id: software.implementation_feasibility
  candidate_type: criterion
  label: Implementation feasibility
  case_question: Can the team deliver, operate, secure, and support the option within time, skill, budget, and organisational constraints?
  selection_rule: Select for every implementation or migration decision.
  evidence_types: [delivery_plan, skills_inventory, proof_of_concept, dependency_assessment]
  core_mapping: feasibility
  source_refs: [sei.atam, nist.ssdf.1.1]
  adaptation_note: Local synthesis of stakeholder, lifecycle security, delivery, and operational capacity considerations.
- candidate_id: software.reversibility_and_lock_in
  candidate_type: criterion
  label: Reversibility and lock-in
  case_question: What switching, exit, data-portability, migration, and irreversible commitment costs arise?
  selection_rule: Select when vendors, proprietary interfaces, data gravity, or broad migration create path dependency.
  evidence_types: [exit_plan, portability_test, contract_constraints, migration_estimate]
  core_mapping: additional:software.reversibility_and_lock_in
  source_refs: [nist.cloud_standards_roadmap, sei.atam]
  adaptation_note: NIST directly supports cloud portability and lock-in concerns; broader reversibility and exit-cost analysis is a local extension requiring case evidence.
- candidate_id: software.user_and_operator_impact
  candidate_type: criterion
  label: User and operator impact
  case_question: How do case-evidenced usability, workload, error recovery, training, and control change; for web content, what WCAG 2.2 accessibility requirements apply?
  selection_rule: Select when workflows, interfaces, support, or operations materially change.
  evidence_types: [user_research, operator_interviews, accessibility_review, workflow_observation]
  core_mapping: acceptability
  source_refs: [iso.iec.25010.2023, sei.atam, w3c.wcag22]
  adaptation_note: Local synthesis. ATAM supports stakeholder scenarios, ISO supplies public quality framing, and WCAG applies only to web accessibility.
exclusion_rules:
- Do not use the pack as a substitute for a threat model, architecture evaluation, legal review, accessibility audit, or production readiness review.
- Do not treat use of public ISO summaries as certification or full conformance to the standard.
composition_rules:
- Use this initial pack alone; record cross-domain needs in the gap log rather than composing packs.
- Prioritise case-specific quality scenarios and business drivers; do not score every candidate mechanically.
