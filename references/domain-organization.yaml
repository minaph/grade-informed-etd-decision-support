pack_id: organization-product-operations
version: 2.0.0
applicability_questions:
- Does the decision concern organizational policy, product development, workforce practice, or operating process?
candidates:
- candidate_id: organization.outcome.value
  candidate_type: outcome
  label: User, worker, and organizational value
  rule: Consider user value, productivity, reliability, retention, safety, revenue, cost, wellbeing, and strategic
    fit.
- candidate_id: organization.harm.operational
  candidate_type: harm
  label: Operational and workforce harms
  rule: Consider privacy, security, failure, burnout, lock-in, reputational harm, and displacement of work.
- candidate_id: organization.equity.distribution
  candidate_type: equity
  label: Distribution of benefit and burden
  rule: Identify user, worker, customer, or supplier groups with unequal access, benefit, burden, or risk.
- candidate_id: organization.implementation.capacity
  candidate_type: implementation
  label: Operational capacity
  rule: Assess budget, staffing, technical dependencies, procurement, change management, and security controls.
- candidate_id: organization.monitoring.value
  candidate_type: monitoring
  label: Value, incidents, cost, and equity
  rule: Monitor value realization, adoption, incidents, cost, workload, equity gaps, and reversibility.
evidence_source_map:
- Internal metrics
- Experiments
- Operational incidents
- User research
- Financial models
- External benchmarks
jurisdiction_prompts:
- Employment
- Consumer protection
- Privacy
- Security
- Accessibility
- Contract
- Sector regulation
exclusion_rules:
- Use GRADE-informed labeling; do not claim formal GRADE for ordinary product or operations decisions.
composition_rules:
- Deduplicate candidates by concept while preserving pack provenance.
- Keep health and non-health outcomes methodologically separate.
- Record unresolved cross-domain conflicts.
